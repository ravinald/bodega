name: Release

on:
  push:
    tags: ['v*']

# Each job asks for what it uses. The write scopes and the OIDC token reach the
# build job alone, never the gate check that runs ahead of it.
permissions: {}

jobs:
  # ci.yml does not run on a tag, so this asks its gate about the tagged
  # commit instead. event=push and branch=main are what tie the answer to
  # main: ci.yml runs on push for main alone, and a pull_request run reports a
  # branch commit that may never have merged. The commit and its tag can land
  # minutes apart, so a run still in progress is waited on, not failed.
  ci-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
    steps:
      - name: Wait for ci.yml's gate to pass on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          deadline=$(( $(date +%s) + 55 * 60 ))
          while :; do
            run=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&branch=main&per_page=1" \
              --jq '.workflow_runs[0].id // empty')
            state=
            if [ -n "$run" ]; then
              state=$(gh api "repos/$REPO/actions/runs/$run/jobs" \
                --jq '.jobs[] | select(.name == "gate") | .status + " " + (.conclusion // "")')
            fi
            case "$state" in
              "completed success")
                echo "ci.yml gate passed for $SHA (run $run)"
                exit 0 ;;
              completed*)
                echo "::error::ci.yml gate concluded '${state#completed }' for $SHA (run $run); fix main and tag a commit whose gate passed"
                exit 1 ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              if [ -z "$run" ]; then
                echo "::error::no ci.yml push run on main for $SHA; a release tag must name a commit on main"
              else
                echo "::error::ci.yml gate for $SHA (run $run) did not finish in time: '${state:-not started}'"
              fi
              exit 1
            fi
            echo "waiting on ci.yml gate for $SHA: ${run:-no run yet} ${state:-pending}"
            sleep 30
          done

  # The site publishes api/openapi.yaml as the API reference and prints its
  # info.version, so a tag naming another version is refused before anything
  # is built or signed. go test exits 0 when -run matches no test, so the grep
  # is what fails this job if the test is ever renamed or removed.
  api-version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Refuse a tag whose version differs from api/openapi.yaml's
        env:
          BODEGA_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -o pipefail
          go test ./internal/server -count=1 -v -run '^TestOpenAPIVersionMatchesReleaseTag$' | tee api-version.log
          grep -q '^--- PASS: TestOpenAPIVersionMatchesReleaseTag' api-version.log

  build:
    needs: [ci-gate, api-version]
    permissions:
      contents: write       # create the GitHub release
      id-token: write       # cosign keyless signing and attestation via OIDC
      attestations: write   # store the build provenance
    uses: ./.github/workflows/release-build.yml

  # GoReleaser leaves the release a draft, so nothing is public until every
  # asset has been checked against the signature and the attestations the
  # build job produced. This job holds no id-token: it verifies and publishes,
  # and can sign nothing.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write       # read the draft's assets and publish it
      attestations: read    # gh attestation verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.0.6'
      - name: Verify the draft, then publish it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! scripts/verify-release.sh "$TAG"; then
            echo "::error::release $TAG was not published: scripts/verify-release.sh failed against its draft; the per-file ok/FAIL lines above name what failed, and the draft is kept for inspection"
            exit 1
          fi
          gh release edit "$TAG" --repo ravinald/bodega --draft=false
