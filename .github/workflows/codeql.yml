name: CodeQL

# No pull_request trigger: security-and-quality takes ~147s and re-examines a
# diff golangci-lint and govulncheck already read in CI, which an item going
# several remand rounds pays for every round. Trunk and the weekly run still
# catch it well before a tag.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'   # weekly Monday 04:17 UTC

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: github/codeql-action/init@v4
        with:
          languages: go
          queries: security-and-quality
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
