name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - run: make vet
      # The gate/CI drift guard runs here rather than in its own job: it is a
      # sed and a grep, and a job of its own would be one more entry in the
      # list it exists to keep honest.
      - run: make ci-drift
      - run: make pin-check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Action v7 is required for golangci-lint v2.x (our .golangci.yml is v2 format).
          version: v2.12.2
          args: --timeout=5m

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      # Pinned for the reason shfmt is pinned in `harness`: goimports changes
      # its grouping between releases, so an unpinned install fails `make
      # fmt-check` on a tool bump nobody made.
      - run: go install golang.org/x/tools/cmd/goimports@v0.50.0
      - run: make fmt-check

  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - run: make tidy-check

  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # shellcheck and jq ship on the runner image; shfmt does not, so it is
      # installed here. jq matters because the harness self-test builds every
      # finding record with it.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      # Pinned to the version the Makefile guard expects developers to have
      # locally. shfmt reformats between minor releases, so an unpinned install
      # fails `shfmt -d` on a runner-image bump with no change to the shell.
      - run: go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.0
      - run: make harness

  # internal/server runs 497 test functions with three t.Parallel() calls among
  # them, so it is serial and longer than the rest of the tree combined. The two
  # jobs run side by side; one job running them end to end is what put a pull
  # request over ten minutes.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - run: |
          go list ./... | grep -v '/internal/server$' \
            | xargs go test -race -count=1 -coverprofile=coverage.out
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go test -race -count=1 -coverprofile=coverage-server.out ./internal/server/...
      - name: Coverage summary
        run: go tool cover -func=coverage-server.out | tail -1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-server
          path: coverage-server.out
          retention-days: 14

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: govulncheck
        # Pinned so a failing run names an analyzer somebody can reproduce. The
        # vulnerability data is fetched at run time either way, so this holds
        # the tool still, not what it knows.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

  # FreeBSD arm64 is compiled on a pull request here and nowhere else:
  # GoReleaser builds every release pair, but only at tag time, and
  # test-freebsd runs amd64. internal/storage once sat behind a
  # `linux || darwin` constraint through a release because nothing compiled
  # FreeBSD before a tag.
  #
  # It carries no needs: list. `make ci-drift` reads every needs: in this file
  # against CI_GATE_JOBS, so a second one would report the whole gate as drift.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Cross-compile
        env:
          CGO_ENABLED: 0
        run: |
          for target in freebsd/amd64 freebsd/arm64; do
            GOOS=${target%%/*} GOARCH=${target##*/} go build ./... || exit 1
            echo "built $target"
          done

  # The FreeBSD syscall paths (internal/storage's ACL and extattr code) compile
  # into no Linux binary, so the Linux test jobs never reach them. This runs the
  # whole tree on a FreeBSD kernel in a VM. No `make check` leg can boot one,
  # which is why the Makefile lists it in CI_ONLY_GATE_JOBS.
  #
  # go126 rather than the stock go package, which trails go.mod; the toolchain
  # line in go.mod then fetches the exact patch release. No -race: the Linux
  # jobs carry it, and here it would double a run already inside a VM.
  test-freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "15.1"
          copyback: false
          prepare: |
            pkg install -y go126 git node
            pw useradd -n bodega-ci -m -s /bin/sh
            install -d -o bodega-ci -g bodega-ci -m 0700 /home/bodega-ci/tmp
            chown -R bodega-ci "$GITHUB_WORKSPACE"
          # Unprivileged, as the Linux jobs run: as root, a 0444 audit.db
          # stays writable, a test binary in root's 0700 build dir cannot be
          # re-executed as nobody, and the distfiles client check sees a root
          # that can remount the tree.
          #
          # TMPDIR is the account's own because FreeBSD gives a new file its
          # directory's group, not its creator's: under /tmp every t.TempDir()
          # file is wheel, which a one-group account cannot set setgid on, and
          # the storage tests that restate a group find nothing to restate.
          run: |
            su -m bodega-ci -c 'env HOME=/home/bodega-ci TMPDIR=/home/bodega-ci/tmp PATH=/usr/local/go126/bin:$PATH sh -c "go version && go test -count=1 ./..."'

  # Two release builds of one commit, compared byte for byte through the
  # checksum file every release artifact is listed in. A timestamp or random
  # ID leaking into an archive, a package or an SBOM shows up here on the pull
  # request that introduced it, not after a release nobody can rebuild.
  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          install-only: true
      - name: Build twice and compare
        run: |
          goreleaser release --snapshot --clean --skip=sign
          mv dist/checksums-sha256.txt "$RUNNER_TEMP/first-checksums-sha256.txt"
          goreleaser release --snapshot --clean --skip=sign
          diff "$RUNNER_TEMP/first-checksums-sha256.txt" dist/checksums-sha256.txt

  # Branch protection requires gate alone, so gate has to fail whenever any job
  # it names did not succeed. Without always(), a failed job skips gate, and
  # GitHub counts a skipped required check as passing. `make ci-drift` reads
  # the needs: list against CI_GATE_JOBS and refuses a gate without always().
  gate:
    if: always()
    runs-on: ubuntu-latest
    needs: [vet, lint, fmt, tidy, test, test-server, harness, test-freebsd, reproducible]
    steps:
      - name: Every gate job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        # jq -e exits nonzero on a false answer and on input it cannot parse,
        # so a malformed needs object fails the gate rather than passing it.
        run: |
          printf '%s\n' "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
          printf '%s\n' "$NEEDS" | jq -e 'length > 0 and all(.[]; .result == "success")' > /dev/null
