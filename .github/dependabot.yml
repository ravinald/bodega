version: 2
updates:
  # Dependabot does not touch the `toolchain` directive in go.mod, and
  # actions/setup-go reads that directive via go-version-file. A stale pin
  # therefore holds CI on an old Go patch no matter what check-latest says,
  # and govulncheck starts failing on standard-library CVEs. Bump it by hand.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ['*']
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
      include: scope
