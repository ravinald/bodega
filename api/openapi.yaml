openapi: "3.0.3"
info:
  title: bodega API
  description: REST API for the bodega package repository manager.
  version: 0.1.0
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: packages
    description: Package manifest operations
  - name: status
    description: Server health and status
  - name: config
    description: Server configuration
  - name: metrics
    description: Package metrics
  - name: profiles
    description: What one class of host may fetch
  - name: client
    description: Configuration a client host reads to point its package systems at bodega
  - name: attestation
    description: Keys bodega signs attestations with
  - name: inventory
    description: Installed-package reports from inventory sources

paths:
  /healthz:
    get:
      summary: Health probe
      description: Returns "ok" when the server is running.
      operationId: healthz
      tags: [status]
      responses:
        "200":
          description: Server is healthy
          content:
            text/plain:
              schema:
                type: string
                example: "ok"

  /api/v1/packages:
    get:
      summary: List all packages
      description: Returns all package manifests grouped by type.
      operationId: listPackages
      tags: [packages]
      responses:
        "200":
          description: All packages by type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackagesResponse"

  /api/v1/packages/import:
    post:
      summary: Import many package entries at once
      description: |
        Imports a whole host's catalog in one request. `bodega pkg import --server`
        is the client for it.

        Separate from `POST /api/v1/packages/{type}` because the two want opposite
        semantics: a single create is all-or-nothing and answers 409 on a name
        clash, while a bulk push is expected to land partially and reports what
        happened to each package.

        The body is either a JSON array of PackageManifest or one manifest per
        line (NDJSON). Both decode a manifest at a time, so a large catalog never
        lands in memory whole. Types may be mixed in one push.

        Every manifest passes the same admission checks as the single-package
        route: structural validation, the upstream allow-list, then the age and
        OSV version checks.

        Restricted to IPs in `admin_permit_cidr`. When the allow-list extends
        beyond localhost, a valid Bearer token is required.
      operationId: importPackages
      tags: [packages]
      security:
        - bearerAuth: []
      parameters:
        - name: merge
          in: query
          required: false
          description: |
            Add versions to packages that already exist instead of reporting a
            conflict. A recorded version is never overwritten, which keeps a
            hosted entry from being downgraded to proxy by a re-import.
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/PackageManifest"
          application/x-ndjson:
            schema:
              $ref: "#/components/schemas/PackageManifest"
      responses:
        "200":
          description: |
            The body parsed. Returned even when every package was refused; the
            per-package results say what happened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: Request body too large (max 64 MiB)

  /api/v1/packages/{type}:
    get:
      summary: List packages by type
      operationId: listPackagesByType
      tags: [packages]
      parameters:
        - $ref: "#/components/parameters/PackageType"
      responses:
        "200":
          description: Packages of the specified type
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PackageManifest"
        "404":
          description: Unknown type
    post:
      summary: Create a new package entry
      description: |
        Creates a new package manifest entry. Restricted to IPs in
        `admin_permit_cidr`. When the allow-list extends beyond localhost,
        a valid Bearer token is required.
      operationId: createPackage
      tags: [packages]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PackageType"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackageManifest"
      responses:
        "201":
          description: Package created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageManifest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Package already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Request body too large (max 1 MiB)

  /api/v1/packages/{type}/{name}:
    get:
      summary: Get a single package
      operationId: getPackage
      tags: [packages]
      parameters:
        - $ref: "#/components/parameters/PackageType"
        - $ref: "#/components/parameters/PackageName"
      responses:
        "200":
          description: Package manifest, with the client configuration for it
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PackageManifest"
                  - type: object
                    properties:
                      client_config:
                        type: array
                        description: |
                          What a client of this package installs, rendered by the
                          server through internal/clientconf. Empty for a hidden
                          package. The version-scoped route does not carry it.
                        items:
                          $ref: "#/components/schemas/ClientConfigFile"
        "404":
          description: Package not found
    delete:
      summary: Delete a package entry
      description: |
        Deletes a package manifest entry. Frozen packages cannot be deleted.
        Same access control as POST.
      operationId: deletePackage
      tags: [packages]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PackageType"
        - $ref: "#/components/parameters/PackageName"
      responses:
        "200":
          description: Package deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: deleted
                  type:
                    type: string
                  name:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Package not found

  /api/v1/packages/{type}/{name}/{version}:
    get:
      summary: Get a single version of a package
      description: |
        Returns the package manifest with every top-level field intact and
        `versions` holding only the matching entry, so the payload round-trips
        through `bodega pkg import` and the editor. This is where a version's
        vetting stamps are read back.
      operationId: getPackageVersion
      tags: [packages]
      parameters:
        - $ref: "#/components/parameters/PackageType"
        - $ref: "#/components/parameters/PackageName"
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Package manifest scoped to one version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageManifest"
        "404":
          description: Unknown type, or package or version not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/packages/{type}/{name}/{version}/attestation:
    get:
      summary: Fetch a version's provenance attestation
      description: |
        Resolves the `attestation_uri` recorded on the version entry and answers
        with the envelope. Nothing in bodega writes that blob: an external
        authority puts it somewhere and the manifest records where, so this
        route reads rather than generates.

        An `https://` URI answers 302 to it. An `s3://` URI is proxied from the
        backend whose bucket matches, falling back to the type rule when no
        configured backend claims that bucket — the fallback is what answered
        before named backends existed, and a WARN in the journal says which of
        the two resolved it.

        Not gated by the host profile. A profile refuses artifacts; this is
        metadata about one, and the decision to leave it ungated is recorded
        against issue #300.
      operationId: getAttestation
      tags: [packages]
      parameters:
        - $ref: "#/components/parameters/PackageType"
        - $ref: "#/components/parameters/PackageName"
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The attestation envelope, proxied from object storage
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "302":
          description: Redirect to the http(s) attestation_uri the entry records
        "404":
          description: Unknown type, package or version, or no attestation_uri recorded
        "502":
          description: attestation_uri is malformed or names an unsupported scheme

  /api/v1/attestation/keys:
    get:
      summary: List the attestation signing keys
      description: |
        Every attestation key bodega publishes, in the order its key file holds
        them. The last entry with `retired: false` is the one that signs; the
        others stay listed so attestations they signed still verify. A retired
        key's private half is gone from the server.

        Unauthenticated, like the apt keyring routes. This route supplies the
        key a key ID names; it does not tell a verifier which key ID to trust.
        Pin that from a channel other than this server.

        An empty array means no attestation key is installed.
      operationId: listAttestationKeys
      tags: [attestation]
      responses:
        "200":
          description: The published keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttestationKey"

  /api/v1/packages/{type}/{name}/hide:
    patch:
      summary: Toggle hidden flag
      description: Toggles the hidden flag on all versions of a package.
      operationId: toggleHidden
      tags: [packages]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PackageType"
        - $ref: "#/components/parameters/PackageName"
      responses:
        "200":
          description: Updated package manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageManifest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Package not found

  /api/v1/packages/{type}/{name}/hide/{version}:
    patch:
      summary: Toggle hidden flag on a specific version
      operationId: toggleHiddenVersion
      tags: [packages]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PackageType"
        - $ref: "#/components/parameters/PackageName"
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated package manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageManifest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Package not found

  /api/v1/packages/{type}/{name}/freeze:
    patch:
      summary: Toggle frozen flag
      description: Toggles the frozen flag on all versions of a package.
      operationId: toggleFreeze
      tags: [packages]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PackageType"
        - $ref: "#/components/parameters/PackageName"
      responses:
        "200":
          description: Updated package manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageManifest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Package not found

  /api/v1/packages/{type}/{name}/freeze/{version}:
    patch:
      summary: Toggle frozen flag on a specific version
      operationId: toggleFreezeVersion
      tags: [packages]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PackageType"
        - $ref: "#/components/parameters/PackageName"
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated package manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageManifest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Package not found

  /api/v1/audit:
    get:
      summary: Query audit events
      description: Returns audit events matching the given filters.
      operationId: queryAudit
      tags: [status]
      parameters:
        - name: type
          in: query
          schema:
            type: string
          description: "Event type filter (e.g. fetch, build, create, delete, cache)"
        - name: pkg_type
          in: query
          schema:
            type: string
        - name: name
          in: query
          schema:
            type: string
        - name: client
          in: query
          schema:
            type: string
          description: Client IP filter
        - name: since
          in: query
          schema:
            type: string
          description: "ISO date or RFC3339 timestamp"
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"

  /api/v1/inventory/sources/{instance}/{route}:
    post:
      summary: Push an inventory report to a source
      description: >
        One route per push source route, under the instance name configured in
        inventory_sources. Only routes an enabled push source registered exist;
        anything else answers 404 from inside admin_permit_cidr and 403 from
        outside it. These routes are exempt from the admin_permit_cidr gate and
        are authenticated by the source. The built-in cyclonedx source takes a
        CycloneDX 1.5 or 1.6 JSON document at route "bom" from a token scoped
        "inventory" that carries an identity binding. An osquery source in
        server mode answers osquery's remote API at "enroll", "config" and
        "log", authenticated by enroll secret and node_key in the body and
        answering {"node_invalid": true} with 200 for every failed check; in
        shipper mode it takes osquery result-log NDJSON at "results" from a
        token scoped "inventory".
      operationId: pushInventory
      tags: [inventory]
      security:
        - bearerAuth: []
      parameters:
        - name: instance
          in: path
          required: true
          schema:
            type: string
          description: Source instance name from inventory_sources
        - name: route
          in: path
          required: true
          schema:
            type: string
          description: Route the source registered, e.g. "bom"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The source's own document format
      responses:
        "202":
          description: Report stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  instance:
                    type: string
                  reports:
                    type: integer
                  attempts:
                    type: integer
                  unbound:
                    type: integer
                    description: Reports stored without an identity because no host mapping names their external id
        "400":
          description: The document did not parse or normalize
        "401":
          description: Missing, unknown or expired token
        "403":
          description: Token scope does not reach this route, or the token is bound to no identity
        "404":
          description: No enabled push source serves this instance and route
        "413":
          description: Body over the source's max_body_bytes

  /api/v1/inventory/{identity}:
    get:
      summary: A host's installed set, classified against what bodega served it
      description: >
        The union of the latest report from each inventory source instance
        mapped to the identity. Each component carries the class recorded when
        its report arrived (refused, unknown, unattributed, served, baseline,
        or unclassified for a report nothing classified: it arrived before
        reconciliation ran, or while the audit sink could not answer),
        the reason, and the instances that reported it. Each mapped instance is
        listed with its last report and whether it is stale: no report within
        twice its interval. Disagreements list components one instance reports
        and another enabled instance covering that ecosystem omits. alert is
        true when a component is refused, unknown or unclassified, or there is
        a disagreement, which is when `bodega inventory report` exits 1.
        Admin-gated like the other /api/v1 reads.
      operationId: getInventoryHost
      tags: [inventory]
      security:
        - bearerAuth: []
      parameters:
        - name: identity
          in: path
          required: true
          schema:
            type: string
          description: Identity the host mapping binds the host to
      responses:
        "200":
          description: The host's classified installed set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryHostReport"
        "403":
          description: Caller is not in admin_permit_cidr
        "404":
          description: No inventory source maps this identity
        "503":
          description: Audit database not configured

  /api/v1/profiles/{name}/pins:
    get:
      summary: List a profile's version pins
      description: >
        Returns every version this profile holds at one release, with the reason
        an operator recorded, who recorded it and when, the review date, how far
        past it the pin is, and the OSV advisories against the pinned version.
        A pinned version no OSV run has ever answered for reports state
        "unchecked" rather than "clean".


        A pin accepts the known vulnerabilities in that version for the life of
        the pin. bodega reports what it knows about what it serves and tracks no
        remediation: there is no suppression workflow, no ticket integration and
        no severity SLA here, and the pin's own reason and review date are the
        whole of its suppression concept.


        Admin-gated, with the audit trail and the token list: this is the list
        of versions a class of host is deliberately not patching.
      operationId: listProfilePins
      tags: [profiles]
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Profile name
        - name: stale
          in: query
          schema:
            type: string
            enum: ["true"]
          description: Narrow the report to the pins past their review date
      responses:
        "200":
          description: The profile's pins
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    type: string
                  pins:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProfilePin"
        "403":
          description: Caller is not in admin_permit_cidr
        "404":
          description: No such profile
        "503":
          description: Audit database not configured

  /client/plan:
    get:
      summary: The plan a client host reads to learn which files it installs
      description: >
        Resolves the requesting host through the identity bindings (token, then
        longest-prefix CIDR) and the profile bound to that identity, and returns
        one record per file the host installs, or one refusal or skip record per
        system with nothing to install. Every one of the ten systems appears.
        An unidentified host gets 403. plan.txt carries the same records
        tab-separated. Every response is written to the audit trail.
      operationId: getClientPlan
      tags: [client]
      parameters:
        - $ref: "#/components/parameters/ClientOS"
        - $ref: "#/components/parameters/ClientABI"
        - $ref: "#/components/parameters/ClientCodename"
        - $ref: "#/components/parameters/ClientRelease"
      responses:
        "200":
          description: The host's plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientPlan"
        "400":
          $ref: "#/components/responses/ClientError"
        "403":
          $ref: "#/components/responses/ClientError"

  /client/plan.txt:
    get:
      summary: The client plan, tab-separated
      description: >
        The records GET /client/plan returns, one per line, fields in the order
        identity, profile, match, system, action, path, url, sha256, reason,
        separated by one tab. An empty field is written as "-", because a POSIX
        sh read with IFS set to a tab collapses two adjacent tabs.
      operationId: getClientPlanText
      tags: [client]
      parameters:
        - $ref: "#/components/parameters/ClientOS"
        - $ref: "#/components/parameters/ClientABI"
        - $ref: "#/components/parameters/ClientCodename"
        - $ref: "#/components/parameters/ClientRelease"
      responses:
        "200":
          description: The host's plan
          content:
            text/plain:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/ClientError"
        "403":
          $ref: "#/components/responses/ClientError"

  /client/setup.sh:
    get:
      summary: The POSIX sh script that applies a host's plan
      description: >
        The same bytes for every host, embedded in the binary. It fetches
        plan.txt for the host it runs on, checks every file against the plan's
        SHA-256 before touching the host, prints a unified diff per file, and
        writes only under --apply, backing up each file it replaces. Its digest
        is client_setup_sha256 in GET /api/v1/status. An unidentified host gets
        403, as on every /client/ route.
      operationId: getClientSetupScript
      tags: [client]
      responses:
        "200":
          description: The script
          content:
            text/plain:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/ClientError"

  /client/osquery-ship.sh:
    get:
      summary: The POSIX sh shipper that forwards osquery's log to bodega
      description: >
        The same bytes for every host, embedded in the binary. Run from cron, it
        reads osqueryd's filesystem log from a recorded byte offset and posts
        new complete lines to an osquery source's results route, advancing the
        offset only on a 2xx. Its digest is osquery_ship_sha256 in GET
        /api/v1/status. An unidentified host gets 403, as on every /client/
        route.
      operationId: getOsqueryShipScript
      tags: [client]
      responses:
        "200":
          description: The script
          content:
            text/plain:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/ClientError"

  /client/{system}:
    get:
      summary: One system's client file, rendered for the requesting host
      description: >
        The file a plan's install record names by URL. A system the host's
        profile excludes is refused with 403; a system with nothing to install
        on this host answers 404 with the reason.
      operationId: getClientFile
      tags: [client]
      parameters:
        - name: system
          in: path
          required: true
          schema:
            type: string
            enum: [apt, git, pypi, binary, gomod, helm, npm, cargo, freebsd, distfiles, osquery]
        - $ref: "#/components/parameters/ClientOS"
        - $ref: "#/components/parameters/ClientABI"
        - $ref: "#/components/parameters/ClientCodename"
        - $ref: "#/components/parameters/ClientRelease"
      responses:
        "200":
          description: The file's content
          content:
            text/plain:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/ClientError"
        "403":
          $ref: "#/components/responses/ClientError"
        "404":
          $ref: "#/components/responses/ClientError"

  /api/v1/tokens:
    get:
      summary: List API tokens
      description: Returns metadata for all tokens. Hashes are never exposed.
      operationId: listTokens
      tags: [status]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Token list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TokenInfo"
    post:
      summary: Create a new API token
      description: |
        Generates a new token. The raw token is included in the response
        and cannot be retrieved later.
      operationId: createToken
      tags: [status]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label:
                  type: string
                expiry:
                  type: string
                  description: "Duration (30d, 1y), date (2027-01-01), or 'never'. Default: 365d"
                comment:
                  type: string
      responses:
        "201":
          description: Token created
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Raw token (only shown once)
                  id:
                    type: string
                  label:
                    type: string
                  expires_at:
                    type: string
                    format: date-time

  /api/v1/policies:
    get:
      summary: List upstream allow-list rules
      description: |
        Returns every allow-list rule, or those for one registry type when
        `type` is given. Restricted to IPs in `admin_permit_cidr`.

        The rule objects carry Go field names rather than the snake_case the
        rest of this API uses, because `audit.PolicyInfo` has no JSON tags.
        That is what ships; changing it breaks existing clients.
      operationId: listPolicies
      tags: [status]
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
          description: Filter to one registry type
      responses:
        "200":
          description: Allow-list rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PolicyRule"
        "403":
          description: Client IP is not in admin_permit_cidr
        "503":
          description: Audit database not configured
    post:
      summary: Add an upstream allow-list rule
      description: |
        The rule kind is derived from the registry type rather than supplied:
        one type has one meaningful match shape, and letting a caller pick
        produced rules that matched nothing. Adding a rule invalidates the
        checker's cache, so it takes effect on the next fetch.
      operationId: createPolicy
      tags: [status]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [registry_type, pattern]
              properties:
                registry_type:
                  type: string
                pattern:
                  type: string
                comment:
                  type: string
      responses:
        "201":
          description: Rule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyRule"
        "400":
          description: Unknown registry type, or pattern missing
        "503":
          description: Audit database not configured

  /api/v1/policies/{id}:
    delete:
      summary: Revoke an allow-list rule
      description: |
        Removes one rule by id and invalidates the checker's cache. Recorded as
        a delete event in the audit trail.
      operationId: revokePolicy
      tags: [status]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Rule revoked
        "404":
          description: No rule with that id
        "503":
          description: Audit database not configured

  /api/v1/tokens/{id}:
    delete:
      summary: Revoke a token
      operationId: revokeToken
      tags: [status]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Token revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: revoked
                  id:
                    type: string

  /api/v1/status:
    get:
      summary: Server status
      description: >-
        Returns health status, entry counts per type, one storage probe row
        per configured backend, and the apt client state: whether a signing key
        is loaded, the served suites, the public URL in force, and one rendered
        sources block per suite.
      operationId: getStatus
      tags: [status]
      responses:
        "200":
          description: Server status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /api/v1/config:
    get:
      summary: Non-sensitive configuration
      description: Returns the bucket, region, and manifest directory. No secrets are exposed.
      operationId: getConfig
      tags: [config]
      responses:
        "200":
          description: Configuration subset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigResponse"

  /api/v1/metrics:
    get:
      summary: Package metrics
      description: Returns global and per-type package count and size metrics.
      operationId: getMetrics
      tags: [metrics]
      responses:
        "200":
          description: Metrics data
          content:
            application/json:
              schema:
                type: object

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        API token generated with `bodega token generate`. Required for
        POST and DELETE when the server accepts connections from non-localhost IPs.

  parameters:
    PackageType:
      name: type
      in: path
      required: true
      schema:
        type: string
        enum: [apt, git, pypi, binary, gomod, helm, npm, cargo, freebsd, distfiles]
    PackageName:
      name: name
      in: path
      required: true
      schema:
        type: string
    ClientOS:
      name: os
      in: query
      required: true
      schema:
        type: string
        enum: [linux, freebsd]
      description: The host's operating system, which the server cannot see
    ClientABI:
      name: abi
      in: query
      schema:
        type: string
        example: "FreeBSD:15:amd64"
      description: The host's pkg ABI, as `pkg config abi` prints it. FreeBSD only.
    ClientCodename:
      name: codename
      in: query
      schema:
        type: string
        example: noble
      description: The host's apt suite, VERSION_CODENAME in /etc/os-release. Linux only.

    ClientRelease:
      name: release
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 99
        example: 14
      description: >-
        FreeBSD major release whose repository tags the pkg overrides disable,
        for a host whose release is not the one its repository is named for.
        Absent keeps the repository's own. FreeBSD only.

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid Bearer token
      content:
        text/plain:
          schema:
            type: string
    Forbidden:
      description: IP not in admin_permit_cidr or entry is frozen
      content:
        text/plain:
          schema:
            type: string
    ClientError:
      description: >
        The reason, as text: a missing or unknown os, an unidentified host (with
        the bodega identity or bodega acl command that would admit it), a system
        the profile excludes, or a system with nothing to install here
      content:
        text/plain:
          schema:
            type: string

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

    AttestationKey:
      type: object
      properties:
        keyid:
          type: string
          description: Lowercase hex SHA-256 of the DER SubjectPublicKeyInfo.
          example: 3f1c0e8a9b7d6c5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e
        alg:
          type: string
          enum: [ed25519]
        public_key_pem:
          type: string
          description: The public key as a PEM SubjectPublicKeyInfo block.
        created_at:
          type: string
          format: date-time
          nullable: true
          description: When `bodega attest key generate` made the key. Null for a key made elsewhere.
        retired:
          type: boolean
          description: True once `bodega attest key retire` has erased the private half. A retired key signs nothing new.
      required: [keyid, alg, public_key_pem, created_at, retired]

    PackagesResponse:
      type: object
      properties:
        apt:
          type: array
          items:
            $ref: "#/components/schemas/PackageManifest"
        git:
          type: array
          items:
            $ref: "#/components/schemas/PackageManifest"
        pypi:
          type: array
          items:
            $ref: "#/components/schemas/PackageManifest"
        binary:
          type: array
          items:
            $ref: "#/components/schemas/PackageManifest"
        gomod:
          type: array
          items:
            $ref: "#/components/schemas/PackageManifest"
        helm:
          type: array
          items:
            $ref: "#/components/schemas/PackageManifest"
        npm:
          type: array
          items:
            $ref: "#/components/schemas/PackageManifest"
        cargo:
          type: array
          items:
            $ref: "#/components/schemas/PackageManifest"
        freebsd:
          type: array
          items:
            $ref: "#/components/schemas/PackageManifest"
        distfiles:
          type: array
          items:
            $ref: "#/components/schemas/PackageManifest"

    PolicyRule:
      type: object
      description: |
        One upstream allow-list rule. The field names are capitalised because
        audit.PolicyInfo carries no JSON tags; the rest of this API is
        snake_case and this is the exception, not the convention.
      properties:
        ID:
          type: string
        RegistryType:
          type: string
          example: pypi
        RuleKind:
          type: string
          description: Derived from RegistryType rather than supplied by the caller
        Pattern:
          type: string
        Comment:
          type: string
        CreatedAt:
          type: string
          format: date-time
        CreatedBy:
          type: string
          description: Token label when added through this API, else the CLI actor

    ImportResult:
      type: object
      description: What happened to one manifest in a bulk import.
      required: [type, name, outcome]
      properties:
        type:
          type: string
          example: apt
        name:
          type: string
          example: curl
        outcome:
          type: string
          enum: [imported, merged, conflict, invalid, policy_blocked, failed]
        reason:
          type: string
          description: Why, when the outcome is not imported or merged.
        warnings:
          type: array
          description: Non-fatal notes; present on a successful import too.
          items:
            type: string

    ImportResponse:
      type: object
      description: The result of a bulk import, per package and in total.
      required: [imported, merged, skipped, results]
      properties:
        imported:
          type: integer
          description: Packages written as new entries.
        merged:
          type: integer
          description: Packages that gained versions on an existing entry.
        skipped:
          type: integer
          description: Packages that did not land; results carries the reason for each.
        results:
          type: array
          items:
            $ref: "#/components/schemas/ImportResult"

    ClientConfigFile:
      type: object
      required: [system, label, content]
      properties:
        system:
          type: string
          description: Package type the file configures a client for
        label:
          type: string
          example: Cargo config
        scope:
          type: string
          description: |
            The variant of the package this file configures: the apt suite, the
            FreeBSD ABI, the git ref, or the filename the read API publishes for
            a binary entry. Absent when the file is the same for every version.
        paths:
          type: object
          description: |
            Where the file belongs, keyed by operating system (linux, freebsd,
            darwin). Holds only the systems the client runs on. Absent for a
            download link, which is no file.
          additionalProperties:
            type: string
          example:
            linux: /etc/pip.conf
            freebsd: /etc/pip.conf
            darwin: /Library/Application Support/pip/pip.conf
        content:
          type: string
          description: The file's content, or the URL for a download link
        notes:
          type: array
          items:
            type: string
    PackageManifest:
      type: object
      required: [name, type]
      properties:
        config_version:
          type: integer
          description: Schema version
        name:
          type: string
          description: Package name
        type:
          type: string
          enum: [apt, git, pypi, binary, gomod, helm, npm, cargo, freebsd, distfiles]
        description:
          type: string
        dep_policy:
          type: string
          enum: [none, direct, transitive]
        storage_policy:
          type: string
          description: >-
            Backend the next version of this package is written to, overriding
            storage_by_type. Setting it moves no stored bytes.
        storage_groups:
          type: array
          description: Storage groups this package belongs to, resolved to a backend by storage_by_group.
          items:
            type: string
        versions:
          type: array
          items:
            $ref: "#/components/schemas/VersionEntry"

    VersionEntry:
      type: object
      properties:
        version:
          type: string
        url:
          type: string
          description: >-
            The upstream this version is fetched from. Published without its
            userinfo, username included, to every caller whatever its
            address or token; the stored manifest keeps it.
        mode:
          type: string
          enum: [hosted, proxy]
        version_constraint:
          type: string
          enum: [exact, compatible, patch, any]
        ref:
          type: string
          description: Git ref (tag, branch, SHA)
        source:
          type: string
          enum: [release, clone]
          description: Git source mode
        source_name:
          type: string
          description: Upstream apt package name
        source_package:
          type: string
          description: >-
            Debian source package this binary was built from. Absent when no
            capture recorded it, which does not mean it equals the binary name.
        capture_suite:
          type: string
          description: Distribution release the captured host ran, e.g. noble. Not a publishing field.
        build_cmd:
          type: string
        deb_glob:
          type: string
        suites:
          type: array
          description: Apt suites this .deb is published to. Absent means the server's default suite.
          items:
            type: string
        generated:
          type: boolean
          description: >-
            FreeBSD repository whose catalogue bodega builds and signs, rather
            than one copied from upstream.
        filename:
          type: string
          description: >-
            Binary filename override. On the read routes, every binary entry
            is published with a download alias instead, `~/<tag>/<display>`,
            which carries no userinfo;
            `/binaries/{name}/{version}/~/<tag>/<display>` serves that
            entry's stored object from the backend it records, or 404 once
            the entry is gone or has moved backend, or the server's pepper
            has changed. A server with no pepper publishes every binary
            entry as the withheld alias,
            `~/00000000000000000000000000000000/<display>`, which answers 404:
            read it as no download link published. A request for a stored
            name is still served from the first entry of its version.
        sha256:
          type: string
          description: Expected SHA-256 for binary downloads
        app_version:
          type: string
          description: Helm app version
        required_by:
          type: array
          items:
            type: string
        checksum:
          $ref: "#/components/schemas/Checksum"
        checksum_verified:
          type: boolean
        platform:
          type: string
          description: Target platform (e.g. linux/amd64)
        build_env:
          $ref: "#/components/schemas/BuildEnv"
        artifact_size:
          type: integer
          format: int64
          description: Size in bytes
        dependencies:
          type: array
          description: >-
            What this version declares it needs, recorded at fetch time. Absent
            means no fetch recorded any, not that the version has none.
          items:
            $ref: "#/components/schemas/Dependency"
        npm_bin:
          type: object
          description: >-
            npm only. Command name to path inside the package, recorded at
            fetch from the tarball's package.json and published as the
            packument's bin.
          additionalProperties:
            type: string
        published_at:
          type: string
          format: date-time
          description: >-
            When upstream published this version, RFC 3339 in UTC, recorded at
            fetch or import for npm, pypi, gomod and cargo. The hosted indexes publish
            it; absent means no fetch could read one, and the indexes leave
            the version undated.
        artifact_digest:
          type: string
          description: >-
            Hex SHA-256 of the bytes bodega stored. checksum is what this
            version should be; this is what bodega has.
        storage:
          type: string
          description: Backend holding this version's bytes. Absent means `default`.
        hidden:
          type: boolean
        frozen:
          type: boolean
        description:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string

    BuildEnv:
      type: object
      description: The build server's environment when the artifact was produced.
      properties:
        platform:
          type: string
          example: linux/amd64
        os_release:
          type: string
        python:
          type: string
        go:
          type: string
        rust:
          type: string
        bodega:
          type: string
          description: Build version of the bodega that produced the artifact
        built_at:
          type: string
          format: date-time

    Dependency:
      type: object
      description: >-
        One dependency a version declares, in the form the registry protocol
        publishes. name and req are every ecosystem's; the rest are cargo
        sparse-index members.
      required: [name, req]
      properties:
        name:
          type: string
        req:
          type: string
          description: Version requirement as the registry publishes it
        features:
          type: array
          items:
            type: string
        optional:
          type: boolean
        default_features:
          type: boolean
        target:
          type: string
          description: cfg() expression or triple the dependency is conditional on
        kind:
          type: string
          enum: [normal, build, dev]
          description: Absent means normal

    Checksum:
      type: object
      properties:
        algorithm:
          type: string
          enum: [sha256, sha1, md5]
        value:
          type: string
          description: Hex-encoded digest

    StatusResponse:
      type: object
      properties:
        healthy:
          type: boolean
        version:
          type: string
          description: >-
            Build stamp of the running server, present only for a caller inside
            `admin_permit_cidr`. A package repository answers a whole fleet, so
            its build number is a public statement of which advisories apply to
            it.
        entry_count:
          type: object
          additionalProperties:
            type: integer
        apt:
          $ref: "#/components/schemas/AptStatus"
        freebsd:
          $ref: "#/components/schemas/FreeBSDStatus"
        spool:
          $ref: "#/components/schemas/SpoolStats"
        backend_entries:
          type: array
          description: >-
            One probe row per configured storage backend, named by `backend`.
            The driver behind a name is deliberately not reported: a client
            reading this endpoint acts on whether the objects are there and on
            which backend failed, and the same name may be backed by a local
            directory on one install and a bucket on the next.

            This array was `s3_entries` and its rows carried `s3_key` and
            `in_s3` through 0.1.0. Both named a driver for objects a `local`
            install keeps on disk, and neither is emitted now: read `key` and
            `present`, and `backend` for which store answered.
          items:
            $ref: "#/components/schemas/BackendEntryStatus"
        error:
          type: string
        client_setup_sha256:
          type: string
          description: >-
            SHA-256 of GET /client/setup.sh. Compare it with the script's own
            digest before running the script.
        osquery_ship_sha256:
          type: string
          description: >-
            SHA-256 of GET /client/osquery-ship.sh. Compare it with the script's
            own digest before running the script.

    SpoolStats:
      type: object
      description: >-
        The live gauge on the disk the proxy spends copying upstream artifacts.
        An operator whose fetches start refusing reads which bound fired here,
        and how close the spool is to it.
      required:
        - in_flight
        - used_bytes
        - peak_bytes
        - budget_bytes
        - max_artifact_bytes
        - refused_too_large
        - refused_budget
      properties:
        dir:
          type: string
          description: >-
            Directory the spool files are written to, present only for a caller
            inside `admin_permit_cidr`. A server filesystem path is a fact about
            the host rather than about what it serves. The counters below carry
            no such gate: a client acting on a 503 has to be able to see why it
            got one.
        in_flight:
          type: integer
          description: Fetches holding a reservation right now.
        used_bytes:
          type: integer
          format: int64
          description: Bytes those fetches hold between them.
        peak_bytes:
          type: integer
          format: int64
          description: >-
            High-water mark of `used_bytes` since the process started, which is
            what sizes the volume.
        budget_bytes:
          type: integer
          format: int64
          description: >-
            The `spool_max_total_bytes` in force. `0` removes the shared budget.
        max_artifact_bytes:
          type: integer
          format: int64
          description: >-
            The `spool_max_artifact_bytes` in force. `0` removes the
            per-artifact ceiling.
        refused_too_large:
          type: integer
          format: int64
          description: >-
            Fetches refused since the process started for declaring more than
            `max_artifact_bytes`. Climbing means the ceiling sits below what
            this archive publishes.
        refused_budget:
          type: integer
          format: int64
          description: >-
            Fetches refused since the process started for arriving while
            `budget_bytes` was already held. Climbing while `peak_bytes` sits at
            the budget means the host carries more concurrent fetches than its
            spool was sized for. The two counters are apart because they call
            for opposite fixes.

    BackendEntryStatus:
      type: object
      description: >-
        One storage probe row, reported against the backend that answered it.
      required: [type, name, key, present, backend, healthy, error]
      properties:
        type:
          type: string
          description: Package type the probe covers.
        name:
          type: string
          description: Probe name within that type, e.g. `apt-pool`.
        key:
          type: string
          description: Object key or prefix that was probed.
        present:
          type: boolean
          description: Whether the backend holds anything under `key`.
        frozen:
          type: boolean
        backend:
          type: string
          description: >-
            The configured backend name this row reports on. Always present;
            `default` is the backend described by the global storage_backend /
            storage_path / bucket / region keys.
        healthy:
          type: boolean
          description: >-
            Whether this backend answered its probe. False on a failure, true
            on a successful listing including an empty one, so `present:
            false` beside `healthy: true` is a backend holding nothing, not a
            broken one. Every caller receives it, and it is how a caller
            outside `admin_permit_cidr` tells which backend failed.
        error:
          type: string
          description: >-
            The backend's failure for this row, verbatim, for a caller in
            `admin_permit_cidr`. A `local` backend's names a directory under
            `storage_path`, and an `s3` backend's names the bucket, so every
            other caller receives an empty string here. Always present; empty
            on a healthy row for every caller.

    AptStatus:
      type: object
      description: >-
        How apt clients reach this server. Every field is state the running
        process holds; an emitter that derived any of it instead produced a
        sources line that was wrong on that axis.
      properties:
        signed:
          type: boolean
          description: A signing key is loaded, so the index carries InRelease and Release.gpg.
        fingerprints:
          type: array
          description: Primary key fingerprints, uppercase hex, in load order.
          items:
            type: string
        keyring_url:
          type: string
          description: Route serving the dearmored keyring Signed-By takes directly. Absent when unsigned.
        suites:
          type: array
          description: Suites served under /apt/dists/.
          items:
            type: string
        mirrored:
          type: array
          description: >-
            Codenames proxied from an upstream archive rather than generated
            here, sorted. Upstream's signature authenticates these, so a client
            reading this tells the two kinds apart without parsing a stanza.
          items:
            type: string
        unserved:
          type: array
          description: >-
            Manifest entries naming no suite this server answers for, capped at
            ten. Read the total off `unserved_count` rather than this array's
            length: a truncated array on its own reads as "these are all of
            them". Reported rather than refused: staging an entry before adding
            its suite is a legitimate order, and with nothing reporting it the
            package disappears behind apt's "Unable to locate package".
          items:
            $ref: "#/components/schemas/AptUnservedEntry"
        unserved_count:
          type: integer
          description: >-
            Every unserved entry, counted. Exceeds the length of `unserved`
            once that array hits its cap of ten. Absent when every entry is
            served.
        public_url:
          type: string
          description: >-
            Base URL clients reach the server at. The configured public_url
            when set, otherwise the origin of this request with
            X-Forwarded-Proto honored from a trusted peer.
        sources:
          type: array
          description: One rendered client configuration per served suite.
          items:
            $ref: "#/components/schemas/AptSources"
        filtered:
          type: array
          description: >-
            Codenames generated from a profile's view of a mirrored codename,
            sorted. Clients treat these as generated suites — bodega's key signs
            them and Signed-By: goes on the line — and they are separate from
            `suites` because no apt_suites entry produced them.
          items:
            type: string
        profile:
          type: string
          description: >-
            Profile bound to the request that asked, when one scopes apt for it.
            Absent otherwise.
        host:
          allOf:
            - $ref: "#/components/schemas/AptSources"
          description: >-
            The one stanza the requesting host should install. Absent in two
            states. When a profile scopes apt for the host but no codename has
            been generated for it, because the rebuild refused the base or has
            not run since the profile was written, `profile` is present and
            `host` is not: naming the base instead would serve the unfiltered
            index the profile exists to narrow. When no profile scopes apt and
            this instance serves more than one codename, the answer is the
            operator's and both are absent: a guess there points a host at the
            wrong suite with nothing reporting it.

    AptUnservedEntry:
      type: object
      description: >-
        One manifest entry whose suites this server does not answer for.
      required: [name, version, suites]
      properties:
        name:
          type: string
          description: Package name.
        version:
          type: string
          description: Package version.
        suites:
          type: array
          description: Suites the entry names, none of which is served.
          items:
            type: string

    AptSources:
      type: object
      properties:
        signed:
          type: boolean
        mirrored:
          type: boolean
          description: >-
            This codename is proxied from an upstream archive, so upstream's
            signature authenticates it and `signed` says nothing about it.
        suite:
          type: string
        uri:
          type: string
        components:
          type: string
          description: >-
            The rendered Components: line, space separated. "main" for a suite
            bodega generates; for a mirrored codename, the components its
            apt_upstreams entry names, or Ubuntu's four when it names none.
        deb822:
          type: string
          description: The .sources stanza, newline separated.
        one_line:
          type: string
          description: The .list equivalent, carrying the single suite above.
        notes:
          type: array
          description: Consequences of the form rendered, for display beside it.
          items:
            type: string

    FreeBSDStatus:
      type: object
      description: >-
        How pkg clients reach this server. Whether a repository is mirrored or
        generated, and whether a catalogue signing key is loaded, are facts
        only the running process holds, and they decide signature_type: the
        wrong one fails `pkg update` with an error naming the signature.
      properties:
        signed:
          type: boolean
          description: >-
            A pkg catalogue signing key is loaded. It applies to generated
            repositories alone; a mirror carries FreeBSD's own signature
            inside the catalogue archive and bodega signs nothing in that path.
        fingerprint:
          type: string
          description: Fingerprint of the loaded signing key. Absent when none is loaded.
        key_error:
          type: string
          description: >-
            A key file that is present and will not load, which is not the
            same state as no key: every generated catalogue refuses until it
            does. Present for a caller in `admin_permit_cidr` alone: the text
            is the load failure verbatim and names the key file by path.
            `signed` and `fingerprint` answer everyone.
        public_url:
          type: string
          description: >-
            Base URL clients reach the server at, resolved the same way
            AptStatus.public_url is.
        repos:
          type: array
          description: >-
            One rendered client configuration per repository and ABI, sorted
            by repository then ABI. Hidden packages and hidden ABIs are absent.
          items:
            $ref: "#/components/schemas/FreeBSDRepo"
        refused:
          type: array
          description: >-
            Entries no configuration could be rendered for, with the reason.
            Reported rather than dropped: an absent stanza and a refused one
            look identical to a client reading `repos`.
          items:
            type: object
            required: [repo, abi, error]
            properties:
              repo:
                type: string
              abi:
                type: string
              error:
                type: string
                description: >-
                  Why the entry was refused. It quotes the entry's `url`,
                  which may carry upstream credentials, so it is empty for a
                  caller outside `admin_permit_cidr`. `repo` and `abi` answer
                  everyone.

    FreeBSDRepo:
      type: object
      properties:
        tag:
          type: string
          description: >-
            The repository tag this definition uses, "bodega-<repo>". Namespaced
            because pkg merges definitions by tag, so one named for a base
            system repository would replace it rather than stand beside it.
        abi:
          type: string
        repo:
          type: string
        release:
          type: integer
          description: >-
            FreeBSD major release the overrides are named for, read out of the
            ABI unless it was passed separately.
        generated:
          type: boolean
          description: >-
            The catalogue is built here from the packages uploaded to this
            repository rather than copied from upstream, so no signature of
            FreeBSD's reaches a client under it. It does not say bodega signed
            it: a server holding no pkg catalogue signing key renders
            signature_type none for a generated repository, and that field is
            the one to read for the signing half.
        profile:
          type: string
          description: >-
            The profile the requesting host is bound to, when that profile
            states a freebsd rule. url then names the catalogue bodega filtered for
            that profile, re-signed with bodega's pkg key, and signature_type
            and fingerprints trust that key rather than FreeBSD's. Absent for
            a host no such profile binds.
        proxy:
          type: boolean
          description: >-
            Served from upstream on a miss rather than from a finished mirror.
            It answers how much of this repository falls through rather than
            whether any of it does: a catalogue file is fetched from upstream
            in proxy mode and refused in a hosted one, so a proxied repository
            holds nothing of its own. A reader asking whether this repository
            reaches the internet at all wants upstream_fallthrough below,
            which a hosted mirror on a server with proxy_cache_enabled also
            carries. conf says which of the two this is in a paragraph.
        upstream_fallthrough:
          type: boolean
          description: >-
            A request for a path outside this repository's catalogue is
            fetched from upstream. Three terms decide it and the mode is one:
            the entry records a url, and either the mode is proxy or the
            server's proxy cache is on. false is the isolation claim, that
            every request this repository answers stops at bodega, so the
            field is never omitted. It is false for two reasons this bit
            cannot tell apart and conf can: a repository recording no url has
            nothing to resolve a miss against and no server setting changes
            that, while a hosted mirror is isolated only while
            proxy_cache_enabled is off. The emitted paragraph names which of
            the terms holds and what would flip it, because the file is
            installed on a client that never hears about the toggle again.
        pkgbase:
          type: boolean
          description: >-
            A mirror of a repository release engineering signed, which
            verifies against the pkgbase trust store rather than the ports
            one. Two terms decide it: base_release below, and a repository
            built for FreeBSD 15 or later, the first release whose base system
            installs that store. Carried because the upstream URL it is
            derived from does not cross the wire, so a consumer re-rendering
            this configuration cannot work it out again.
        base_release:
          type: boolean
          description: >-
            Upstream calls this repository base_release_<n>, which is release
            engineering's own. It is pkgbase's first term alone, and the two
            differ on a mirror of base_release_<n> built for FreeBSD 13 or 14:
            that one verifies against the ports store, and the emitted comment
            says which term excused it rather than denying the repository its
            name. Omitted when false.
        bootstrap:
          type: string
          description: >-
            What `pkg bootstrap` does against this repository: "works" and
            "absent" are measured, "unknown" is not. A generated repository is
            always "unknown", whatever upstream_fallthrough says: it has no
            upstream and serves what the build tree uploaded, and poudriere
            publishes Latest/pkg.pkg as a symlink the upload skips. For a
            mirror two facts decide it and neither is the serving mode:
            upstream_fallthrough above, and which upstream repository this
            mirrors, because upstream publishes Latest/pkg.pkg under the ports
            repositories and nowhere else. So a base or kmods mirror the
            server does fetch misses for answers the bootstrapper a 404 or a
            502, and a hosted ports mirror on a cache-enabled server answers
            it a package. A mirror nobody measured is "unknown" too. Never
            omitted: an absent value means "unknown" rather than either
            answer.
          enum: [works, absent, unknown]
        url:
          type: string
          description: >-
            Plain https with ${ABI} left literal, never pkg+https: the pkg+
            scheme means SRV mirror discovery against records bodega does not
            publish.
        signature_type:
          type: string
          description: >-
            "fingerprints" against the ports trust store for a mirror of a
            ports repository, against the pkgbase one for a mirror of a
            base_release_<n> repository built for FreeBSD 15 or later, against
            bodega's own for a signed generated repository; "none" for an
            unsigned one. A base_release_<n> mirror for an older release takes
            the ports store, because no older release installs the other.
          enum: [fingerprints, none]
        fingerprints:
          type: string
          description: >-
            Trust directory signature_type names, absent when "none". One of
            /usr/share/keys/pkg, /usr/share/keys/pkgbase-${VERSION_MAJOR} with
            the variable left for pkg to substitute, or bodega's own
            directory. A stanza naming the wrong one of the first two fails
            silently: pkg processes no entries and exits 0.
        disabled:
          type: array
          description: >-
            Upstream repository tags the file turns off, in rendered order.
            One that names the wrong tag leaves the upstream repository
            enabled beside bodega's, and pkg reports nothing about it.
          items:
            type: string
        stanza:
          type: string
          description: >-
            The repository definition alone. Not installable on its own:
            without the disabled overrides the host fetches from both.
        conf:
          type: string
          description: >-
            The whole file, comments and overrides included, ready to land at
            /usr/local/etc/pkg/repos/bodega.conf.
        notes:
          type: array
          description: Consequences of the form rendered, for display beside it.
          items:
            type: string

    ConfigResponse:
      type: object
      properties:
        bucket:
          type: string
        region:
          type: string
        manifest_dir:
          type: string

    AuditEvent:
      type: object
      description: |
        One audit event. The field names are capitalized because
        audit.StoredEvent carries no JSON tags, the same exception PolicyRule
        documents.
      properties:
        ID:
          type: integer
          format: int64
        Timestamp:
          type: string
          format: date-time
        EventType:
          type: string
        PkgType:
          type: string
        PkgName:
          type: string
        PkgVersion:
          type: string
        ClientIP:
          type: string
        UserAgent:
          type: string
        Status:
          type: string
        DurationMs:
          type: integer
          format: int64
        Details:
          type: string
          description: JSON-encoded context, as a string
        Actor:
          type: string
          description: OS user for CLI and TUI events; empty for HTTP events, which carry ClientIP
        Identity:
          type: string
          description: >-
            Host an identity binding resolved the request to. Empty when nothing
            bound it; it sits beside ClientIP rather than replacing it.
        ObjectKey:
          type: string
          description: >-
            Storage key of the artifact a serve_fetch streamed. Empty on a
            metadata response (an index, a packument) and on every other event.
        Digest:
          type: string
          description: >-
            Lowercase hex SHA-256 bodega recorded for ObjectKey. Empty when
            ObjectKey is, or when nothing recorded a SHA-256 for the key.

    ClientPlan:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/ClientPlanRecord"
        osquery:
          type: array
          description: >-
            One entry per enabled osquery inventory source. Absent when none is
            enabled. plan.txt carries no form of it.
          items:
            $ref: "#/components/schemas/ClientOsqueryPlan"

    ClientOsqueryPlan:
      type: object
      properties:
        instance:
          type: string
          description: The inventory_sources instance name
        mode:
          type: string
          enum: [server, shipper]
        endpoint:
          type: string
          description: >-
            Base URL the instance's routes sit under: enroll, config and log in
            server mode, results in shipper mode
        interval:
          type: integer
          description: Seconds between runs of the schedule's snapshot queries
        python_dirs:
          type: array
          items:
            type: string
          description: Trees python_packages reads on this host, from its profile's osquery_scan_dirs entry
        npm_dirs:
          type: array
          items:
            type: string
          description: Trees npm_packages reads on this host, from its profile's osquery_scan_dirs entry

    ClientPlanRecord:
      type: object
      description: One file a host installs, or why a system has none. Empty fields are "" here and "-" in plan.txt.
      properties:
        identity:
          type: string
          description: The identity the host resolved to
        profile:
          type: string
          description: The profile bound to that identity, empty when none is
        match:
          type: string
          description: The binding that resolved it, "token:<id>" or "cidr:<prefix>"
        system:
          type: string
          enum: [apt, git, pypi, binary, gomod, helm, npm, cargo, freebsd, distfiles, osquery]
        action:
          type: string
          enum: [install, refuse, skip]
          description: >
            install is a file to write; refuse is a system the profile
            excludes; skip is a system with nothing to install on this host
        path:
          type: string
          description: Where the file goes on this host's operating system. A leading ~ is the invoking user's home.
        url:
          type: string
          description: Where to fetch the file
        sha256:
          type: string
          description: Hex SHA-256 of the file the url serves
        reason:
          type: string
          description: Why a refuse or skip record has no file

    InventoryHostReport:
      type: object
      properties:
        identity:
          type: string
        generated_at:
          type: string
          format: date-time
        alert:
          type: boolean
          description: A component is refused, unknown or unclassified, or two sources disagree
        counts:
          type: object
          description: Components per class, and stale instances under "stale"
          additionalProperties:
            type: integer
        sources:
          type: array
          items:
            $ref: "#/components/schemas/InventorySourceState"
        components:
          type: array
          description: Worst class first
          items:
            $ref: "#/components/schemas/InventoryComponent"
        disagreements:
          type: array
          items:
            $ref: "#/components/schemas/InventorySourceDisagreement"

    InventorySourceState:
      type: object
      properties:
        instance:
          type: string
        type:
          type: string
        mode:
          type: string
          enum: [push, pull]
        enabled:
          type: boolean
        interval:
          type: string
          description: Go duration; stale after twice this with no report
        report_id:
          type: integer
          description: The latest report from this instance for the host
        last_report:
          type: string
          format: date-time
          nullable: true
        last_poll:
          type: string
          format: date-time
          description: Pull instances only, the last successful poll
        stale:
          type: boolean
        reason:
          type: string
          description: Why the instance is stale

    InventoryComponent:
      type: object
      properties:
        ecosystem:
          type: string
        name:
          type: string
        version:
          type: string
        paths:
          type: array
          items:
            type: string
        sources:
          type: array
          items:
            type: string
          description: Instances whose latest report holds this component
        class:
          type: string
          enum: [refused, unknown, unattributed, unclassified, served, baseline]
        reason:
          type: string

    InventorySourceDisagreement:
      type: object
      properties:
        ecosystem:
          type: string
        name:
          type: string
        version:
          type: string
        reported_by:
          type: string
        reported_in:
          type: integer
          description: Report id
        absent_from:
          type: string
        absent_in:
          type: integer
          description: Report id

    ProfilePin:
      type: object
      properties:
        profile:
          type: string
        type:
          type: string
          description: Package type
        name:
          type: string
        version:
          type: string
          description: The version this pin holds
        reason:
          type: string
          description: Why the version is held. A pin cannot be written without one.
        actor:
          type: string
        pinned_at:
          type: string
          format: date-time
          description: >
            When the held version was last decided. Absent on a pin written
            before the column existed and never re-pinned since.
        review_after:
          type: string
          description: "Date after which the pin should be re-examined (YYYY-MM-DD)"
        overdue_days:
          type: integer
          description: Whole days past the review date; 0 when the pin is not overdue
        stale:
          type: boolean
        cataloged:
          type: boolean
          description: >
            Whether the catalog still holds the pinned version. False means
            nothing serves it, so there is no OSV stamp to read.
        osv:
          $ref: "#/components/schemas/ProfilePinOSV"

    ProfilePinOSV:
      type: object
      properties:
        state:
          type: string
          enum: [unchecked, clean, flagged, "n/a"]
          description: >
            unchecked when no run has ever answered for this version, which is
            not the same as clean; "n/a" when OSV holds no records for this
            registry type.
        vulns:
          type: array
          items:
            type: string
          description: OSV advisory identifiers recorded against the pinned version
        severity:
          type: object
          description: >
            Scores keyed by advisory id, each the severity array OSV published.
            An id in vulns and absent here is one OSV scored nothing for.
          additionalProperties:
            type: array
            items:
              type: object
              properties:
                type:
                  type: string
                score:
                  type: string
        checked_at:
          type: string
          format: date-time
          description: When the OSV answer was last refreshed. Absent when unchecked.

    TokenInfo:
      type: object
      description: |
        Token metadata. The field names are capitalized because
        audit.TokenInfo carries no JSON tags, the same exception PolicyRule
        documents.
      properties:
        ID:
          type: string
        Label:
          type: string
        Comment:
          type: string
        Scope:
          type: string
          enum: [full, inventory]
          description: full reaches every mutation route; inventory reaches only inventory push routes
        CreatedAt:
          type: string
          format: date-time
        ExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: null when the token never expires
        LastUsed:
          type: string
          format: date-time
          nullable: true
          description: null when the token has never been used
